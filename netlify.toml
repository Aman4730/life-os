[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Same path the Vercel frontend uses, so a Netlify deploy still serves /api/chat.
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

# SPA fallback — every route is served by index.html so client-side
# routing (react-router) works on direct loads and refreshes.
# (Netlify serves /.netlify/functions/* and the /api/chat rewrite above first.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
