[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA fallback — every route is served by index.html so client-side
# routing (react-router) works on direct loads and refreshes.
# (Netlify serves /.netlify/functions/* before this, so the API is unaffected.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
